name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npx ng build --base-href /moovcampus/

      - name: Préparer GitHub Pages
        run: |
          cp dist/moovcampus/browser/index.html dist/moovcampus/browser/404.html
          touch dist/moovcampus/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/moovcampus/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
