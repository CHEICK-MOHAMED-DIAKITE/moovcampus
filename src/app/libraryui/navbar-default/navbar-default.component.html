<div class="ui-navbar-showcase" data-libraryui="main-menu · Default">
  <nav class="nbar nbar--default" [class.nbar--open]="menuOpen()" aria-label="Navigation principale">
    <a routerLink="/" class="nbar-brand" (click)="closeMenu()">
      <div class="nbar-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M7 22 L13 10 L19 22 L25 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="10" r="3" fill="#f2c230" stroke="none"/></svg>
      </div>
      <span class="nbar-brand-name">{{ brandName() }}</span>
    </a>

    <div class="nbar-nav" id="nbar-menu">
      @for (link of links(); track link.path) {
        <a [routerLink]="link.path"
           class="nbar-link"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: !!link.exact }"
           (click)="closeMenu()">
          @if (link.icon) { <i class="bi" [class]="link.icon" aria-hidden="true"></i> }
          {{ link.label }}
        </a>
      }
      <!-- Accès compte dans le panneau mobile -->
      <div class="nbar-mobile-auth">
        @if (userInitials()) {
          <button type="button" class="nbar-link" (click)="onLogout()"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Se déconnecter</button>
        } @else {
          <a routerLink="/connexion" class="nbar-link" routerLinkActive="active" (click)="closeMenu()"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Se connecter</a>
        }
      </div>
    </div>

    <div class="nbar-actions">
      @if (userInitials()) {
        <button class="nbar-icon-btn" type="button" aria-label="Notifications : 2 nouvelles">
          <i class="bi bi-bell"></i>
          <span class="nbar-notif-dot"></span>
        </button>
        <a routerLink="/tableau-de-bord" class="nbar-avatar" [attr.aria-label]="'Mon tableau de bord (' + userName() + ')'" [title]="userName()" (click)="closeMenu()">{{ userInitials() }}</a>
        <button class="nbar-icon-btn nbar-logout" type="button" aria-label="Se déconnecter" title="Se déconnecter" (click)="onLogout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      } @else {
        <a routerLink="/connexion" class="nbar-auth-link" (click)="closeMenu()">Se connecter</a>
        <a routerLink="/inscription" class="nbar-auth-btn" (click)="closeMenu()"><span class="nbar-auth-btn__long">Créer un compte</span><span class="nbar-auth-btn__short">S'inscrire</span></a>
      }
      <button class="nbar-burger" type="button"
              [attr.aria-expanded]="menuOpen()"
              aria-controls="nbar-menu"
              [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
              (click)="toggleMenu()">
        <i class="bi" [class.bi-list]="!menuOpen()" [class.bi-x-lg]="menuOpen()"></i>
      </button>
    </div>
  </nav>
</div>
